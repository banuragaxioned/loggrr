providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "24"
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

[phases.setup]
nixPkgs = ["nodejs_24", "openssl"]

[phases.install]
cmds = ["npm install --prefix /opt/loggrr-bun bun@1.3.14", "/opt/loggrr-bun/node_modules/.bin/bun install --frozen-lockfile"]

[phases.build]
cmds = ["/opt/loggrr-bun/node_modules/.bin/bun run build"]

[start]
cmd = "node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 3000"
